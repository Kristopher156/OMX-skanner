name: OMXS30-skanning

on:
  schedule:
    # Vardagar 16:45 UTC = 17:45 svensk vintertid (18:45 sommartid)
    - cron: "45 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  skanna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installera paket
        run: pip install yfinance pandas

      - name: Kör skannern
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'omx-skanner-ah8p794l2q' }}
          SIDA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python omx30_skanner.py

      - name: Kör backtest
        continue-on-error: true
        run: python backtest.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Kontrollera notis
        run: |
          echo "Notisstatus: $(cat notis_status.txt 2>/dev/null || echo 'ingen notis behövdes')"
          if grep -q '^fel' notis_status.txt 2>/dev/null; then exit 1; fi
